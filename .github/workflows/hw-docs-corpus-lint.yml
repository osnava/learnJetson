# Corpus lint — the deterministic half of the #21 epic.
#
# v2 transition (issue #28, 2026-09-07): fetch.sh now converts with
# docling (multi-GB models, GPU-friendly) — too heavy for a per-push
# runner, so CI no longer fetches/converts the corpus. Corpus
# conversion and the corpus-dependent lint run operator-side (see
# agent/hw-docs/v2/README.md). CI keeps: the synthetic unit tiers
# (committed fixtures carry the contract; docling-dependent tiers SKIP
# loudly — a skip is never a pass) and the corpus-independent linter
# sections (URL/version pins). The full CI story is #30's scope.
name: hw-docs unit tests

on:
  push:
    paths:
      - agent/hw-docs/**
      - .github/workflows/hw-docs-corpus-lint.yml
  pull_request:
    paths:
      - agent/hw-docs/**
      - .github/workflows/hw-docs-corpus-lint.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install test dependencies
        run: pip install openpyxl numpy pyyaml

      - name: unit tests (synthetic tier; corpus/docling tiers SKIP loudly)
        run: |
          python agent/hw-docs/test_grade.py
          python agent/hw-docs/test_check.py
          python agent/hw-docs/test_questions.py
          python agent/hw-docs/v2/test_normalize.py
          python agent/hw-docs/v2/test_search.py
          python agent/hw-docs/v2/test_build.py
          python agent/hw-docs/v2/test_grade.py

      # check.py needs the fetched corpus (it FAILs — correctly — on the
      # memorized answers when the corpus is absent), so the corpus lint
      # runs operator-side during the v2 transition. #30 rebuilds the
      # linter against the docling substrate and rewires this job.
