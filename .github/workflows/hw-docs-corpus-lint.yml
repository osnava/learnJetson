# hw-docs tests + corpus-independent lint (the #21 epic's deterministic half).
#
# Final CI story (issue #30): docling (multi-GB models) is too heavy for a
# per-push runner, so the corpus is never fetched here. The committed
# fixtures carry the contract — fixtures/demo-doc.json exercises the
# grader and the linter end to end, and every test file's real-corpus
# tier skips loudly where the corpus is absent (a skip is never a pass).
# What CI can check without the corpus, it does: the synthetic unit tiers
# plus the corpus-independent linter section — the fetch.sh URL HEADs
# (`lint.py --urls-only`), the stale-URL tripwire #23 installed.
# Corpus conversion and the full provenance lint run operator-side:
# `agent/hw-docs/fetch.sh` then `python agent/hw-docs/lint.py`.
name: hw-docs unit tests

on:
  push:
    paths:
      - agent/hw-docs/**
      - .github/workflows/hw-docs-corpus-lint.yml
  pull_request:
    paths:
      - agent/hw-docs/**
      - .github/workflows/hw-docs-corpus-lint.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install test dependencies
        run: pip install openpyxl numpy pyyaml

      - name: unit tests (synthetic tier; corpus/docling tiers SKIP loudly)
        run: |
          python agent/hw-docs/test_normalize.py
          python agent/hw-docs/test_search.py
          python agent/hw-docs/test_build.py
          python agent/hw-docs/test_grade.py
          python agent/hw-docs/test_lint.py
          python agent/hw-docs/test_questions.py

      - name: corpus-independent lint (URL HEAD checks, no corpus needed)
        run: python agent/hw-docs/lint.py --urls-only
